name: Bug report
description: Something in speckit-eye does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not report security vulnerabilities here: use "Report a security vulnerability" on the previous page.
  - type: input
    id: version
    attributes:
      label: speckit-eye version
      description: The output of `npx speckit-eye --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command run
      description: The exact command, with its options.
      placeholder: "npx speckit-eye --build . --out _site --base /my-repo/"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What you saw, including any error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: tasks.md or spec excerpt
      description: If the problem is about how a document is read or counted, paste the relevant part of `tasks.md` or the spec.
      render: markdown
    validations:
      required: false
