name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The file watcher behaves differently per OS (plan risk), so E2E runs on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Headless browsers have no visible window, so macOS App Nap coalesces
      # their timers: on the runner the page's own 500 ms tooltip timer fired
      # after 601 ms (Chromium) and 671 ms (Firefox), measured in the page.
      # The timing tests (FR-024, SC-006) are about a foreground browser, so
      # turn App Nap off. macOS only; the runner is discarded after the job.
      - if: runner.os == 'macOS'
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 14

  wsl:
    # WSL is a supported platform, and the watcher only works there with the
    # project on the Linux file system (research R2), so test that setup.
    # It tests the file watcher, not browser engines, so Chromium is enough.
    name: E2E live updates (WSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates
      - name: WSL version
        shell: pwsh
        run: wsl.exe --list --verbose
      - name: Live-update E2E tests on the Linux file system
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export CI=true
          uname -r
          cp -r "$(wslpath '${{ github.workspace }}')" ~/app
          cd ~/app
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm@11
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e tests/e2e/live-state.spec.js --project chromium
