name: CI

on:
  push:
  pull_request:
  # release.yml runs the full suite on the release commit.
  workflow_call:
  # bump.yml starts CI on release/next (pushes made with GITHUB_TOKEN start no workflows).
  workflow_dispatch:

permissions: {}

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The file watcher behaves differently per OS (plan risk), so E2E runs on all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Headless browsers have no visible window, so macOS App Nap coalesces
      # their timers: on the runner the page's own 500 ms tooltip timer fired
      # after 601 ms (Chromium) and 671 ms (Firefox), measured in the page.
      # The timing tests (FR-024, SC-006) are about a foreground browser, so
      # turn App Nap off. macOS only; the runner is discarded after the job.
      - if: runner.os == 'macOS'
        run: defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 14

  wsl:
    # WSL is a supported platform, and the watcher only works there with the
    # project on the Linux file system (research R2), so test that setup.
    # It tests the file watcher, not browser engines, so Chromium is enough.
    name: E2E live updates (WSL)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@3b46b44374d5d0ae94654c45d114a3ed7a0e07a8 # v5.0.1
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates
      - name: WSL version
        shell: pwsh
        run: wsl.exe --list --verbose
      - name: Live-update E2E tests on the Linux file system
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export CI=true
          uname -r
          cp -r "$(wslpath '${{ github.workspace }}')" ~/app
          cd ~/app
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm@11
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e tests/e2e/live-state.spec.js --project chromium
