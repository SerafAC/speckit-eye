name: Release

# Publishes speckit-eye to npm (docs/releasing.md, research R10).
#
# - push to main: runs for every change to package.json or CHANGELOG.md, but
#   only a commit merged from release/next (the Bump version PR) whose tag
#   does not exist yet and whose version has a changelog section is released;
#   anything else ends here with "not a release commit".
# - push of a v* tag: a tag pushed by hand (recovery).
# - workflow_dispatch on a tag: re-runs the release of that tag. There is no
#   dry-run mode: to rehearse, review the pending run at the approval step and
#   reject it; nothing is tagged or published before approval.
#
# Every check (full CI, versions agree, not yet on npm, package contents) runs
# before the owner's approval in the npm environment; the tag is created only
# after approval, in the same run as the publish.

on:
  push:
    branches: [main]
    paths:
      - package.json
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Is this a release?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            version="$(node -p "require('./package.json').version")"
            head_ref="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.ref // ""')"
            if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then tag_exists=true; else tag_exists=false; fi
            decision="$(node scripts/release/release.js release-commit --version "$version" --head-ref "$head_ref" --tag-exists "$tag_exists")"
            echo "$decision"
            echo "$decision" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            if ! printf '%s\n' "$decision" | grep -qx 'release=true'; then
              echo "::notice::Not a release commit: $(printf '%s\n' "$decision" | sed -n 's/^reason=//p')"
            fi
          else
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::Run this workflow on a tag (vX.Y.Z), not on $REF_NAME"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "HEAD^{commit}")" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify the release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.check.outputs.dist-tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit belongs to main (FR-009)
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Commit $SHA is not on main"
            exit 1
          fi
      - name: Tag, package.json and changelog agree (FR-010)
        id: check
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/release.js verify --tag "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: The version is not on npm yet (FR-010)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          published="$(npm view "speckit-eye@$VERSION" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "::error::speckit-eye@$VERSION is already on npm"
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack and check the package contents (FR-002)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          pnpm pack --json --pack-destination "$RUNNER_TEMP/release" > "$RUNNER_TEMP/files.json"
          node scripts/release/release.js pack-check "$RUNNER_TEMP/files.json"
          test -f "$RUNNER_TEMP/release/speckit-eye-$VERSION.tgz"
      - name: Release notes (FR-015)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/release.js notes --version "$VERSION" > "$RUNNER_TEMP/release/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    needs: [prepare, ci, verify]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Requires the repository owner's approval (FR-012).
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      # This job pushes the tag, so it keeps the checkout credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Create and push the tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi
      # npm >= 11.5.1 for trusted publishing (research R7).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm publish
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          # First release only (docs/releasing.md); afterwards npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./speckit-eye-$VERSION.tgz" --access public --provenance --tag "$DIST_TAG"

  # Its own job, so "Re-run failed jobs" retries only this, never the publish.
  github-release:
    name: GitHub release
    needs: [prepare, verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Create the GitHub release (FR-015)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=()
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release/notes.md" "${args[@]}"
