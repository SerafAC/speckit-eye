<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stats — original (backup)</title>

<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg)}
.sk{--bg:#F4F3EF;--surface:#FFFFFF;--surface-2:#FAF9F6;--subtle:#EEECE6;--subtle-2:#F1EFEA;--track:#EAE8E2;--border:#E4E1D9;--border-strong:#DEDBD3;--dashed:#C9C5BB;--text:#15171C;--text-2:#2E3238;--text-2b:#25282E;--text-3:#3E434C;--text-4:#4A4F59;--muted:#5B606A;--muted-2:#6B7079;--chip-n:#D8DBE1;--outline-n:#B9BDC5;--inv-bg:#15171C;--inv-fg:#FFFFFF;--chrome:#15171C;--chrome-2:#15171C;--chrome-edge:transparent;--tip-edge:transparent;--green:#1F7A5A;--green-text:#16603F;--green-bg:#E3F1EA;--green-bg-2:#DCEBE3;--blue:#2F5BD3;--blue-text:#1E3F9E;--blue-bg:#E6ECFB;--blue-bg-2:#EEF2FD;--blue-bg-3:#F1F4FD;--blue-soft:#C9D5F5;--blue-ring:#7C9CF0;--orange-bg:#FFF4ED;--amber-bg:#FEF3C7;--amber-bg-2:#FFFBEB;--amber-text:#713F12;--amber-text-2:#854D0E;--amber-border:#E8C872;--purple-bg:#EFE9FB;--purple-text:#4C2D91;--red-bg:#FDE7DC;--red-text:#9A3412;color-scheme:light}.sk[data-theme="dark"]{--bg:#0E1013;--surface:#171A1F;--surface-2:#1C1F25;--subtle:#23272E;--subtle-2:#262A31;--track:#22262D;--border:#2A2E36;--border-strong:#363B45;--dashed:#454B56;--text:#ECEDF0;--text-2:#D6D8DD;--text-2b:#D6D8DD;--text-3:#BEC2C9;--text-4:#A9AEB7;--muted:#9197A1;--muted-2:#8A909A;--chip-n:#3A3F4A;--outline-n:#4A505C;--inv-bg:#ECEDF0;--inv-fg:#15171C;--chrome:#0A0B0E;--chrome-2:#1F232A;--chrome-edge:#23272E;--tip-edge:#3A3F48;--green:#3FB27F;--green-text:#7FD8AE;--green-bg:#163A2B;--green-bg-2:#1A3B2D;--blue:#7C9CF0;--blue-text:#B4C6F8;--blue-bg:#1F2A48;--blue-bg-2:#1B2440;--blue-bg-3:#171F35;--blue-soft:#33456E;--blue-ring:#7C9CF0;--orange-bg:#36200F;--amber-bg:#3A2E0F;--amber-bg-2:#2F260E;--amber-text:#F6D77E;--amber-text-2:#F6D77E;--amber-border:#6E5617;--purple-bg:#2B2242;--purple-text:#C9B8F5;--red-bg:#3D1F14;--red-text:#F7AD8A;color-scheme:dark}@media (prefers-color-scheme: dark){.sk[data-theme="system"]{--bg:#0E1013;--surface:#171A1F;--surface-2:#1C1F25;--subtle:#23272E;--subtle-2:#262A31;--track:#22262D;--border:#2A2E36;--border-strong:#363B45;--dashed:#454B56;--text:#ECEDF0;--text-2:#D6D8DD;--text-2b:#D6D8DD;--text-3:#BEC2C9;--text-4:#A9AEB7;--muted:#9197A1;--muted-2:#8A909A;--chip-n:#3A3F4A;--outline-n:#4A505C;--inv-bg:#ECEDF0;--inv-fg:#15171C;--chrome:#0A0B0E;--chrome-2:#1F232A;--chrome-edge:#23272E;--tip-edge:#3A3F48;--green:#3FB27F;--green-text:#7FD8AE;--green-bg:#163A2B;--green-bg-2:#1A3B2D;--blue:#7C9CF0;--blue-text:#B4C6F8;--blue-bg:#1F2A48;--blue-bg-2:#1B2440;--blue-bg-3:#171F35;--blue-soft:#33456E;--blue-ring:#7C9CF0;--orange-bg:#36200F;--amber-bg:#3A2E0F;--amber-bg-2:#2F260E;--amber-text:#F6D77E;--amber-text-2:#F6D77E;--amber-border:#6E5617;--purple-bg:#2B2242;--purple-text:#C9B8F5;--red-bg:#3D1F14;--red-text:#F7AD8A;color-scheme:dark}}
</style>
</helmet>
<section class="sk" data-theme="{{theme}}" aria-label="Progress" style="width: 1072px; height: 200px; box-sizing: border-box; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 16px; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: var(--text)">
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-size: 13px; color: var(--muted)">Overall completion</span>
<span style="font-size: 13px; color: var(--muted)"><strong style="color: var(--text); font-weight: 600">233</strong> of 242 tasks</span>
</div>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 64px; line-height: 0.9">96<span style="font-size: 36px">%</span></div>
<div style="display: flex; gap: 3px; height: 10px">
<div title="Serial Data Processing Studio" style="flex-grow: 123; background: var(--green); border-radius: 5px 0 0 5px"></div>
<div title="Nocturnal Redesign" style="flex-grow: 24; background: var(--green)"></div>
<div style="flex-grow: 8; background: var(--blue-soft)"></div>
<div title="New Signal Blocks" style="flex-grow: 72; background: var(--green)"></div>
<div title="Rename Summation" style="flex-grow: 14; background: var(--green)"></div>
<div style="flex-grow: 1; background: #c2410c; border-radius: 0 5px 5px 0"></div>
</div>
<div style="display: flex; gap: 18px; font-size: 12px; color: var(--muted)">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 2px; background: var(--green)"></span>Done</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 2px; background: var(--blue-soft)"></span>Open</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #c2410c"></span>Next up</span>
</div>
</div>
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: var(--muted)">Features complete</span>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; line-height: 1">2<span style="font-size: 28px; color: var(--muted-2)"> / 4</span></div>
<span style="font-size: 13px; color: var(--muted)">2 in progress</span>
</div>
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: var(--muted)">Phases complete</span>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; line-height: 1">25<span style="font-size: 28px; color: var(--muted-2)"> / 29</span></div>
<span style="font-size: 13px; color: var(--muted)">4 phases remaining</span>
</div>
<div style="background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 22px 24px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: var(--muted)">Open tasks</span>
<div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 52px; line-height: 1; color: var(--blue)">9</div>
<span style="font-size: 13px; color: var(--muted)">across 2 features</span>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":null},"$preview":{"width":1072,"height":200}}'>
class Component extends DCLogic {
  componentDidMount() {
    var s = this;
    this._th = function () { s.forceUpdate(); };
    window.addEventListener('storage', this._th);
    window.addEventListener('sk-theme', this._th);
  }
  componentWillUnmount() {
    clearTimeout(this._t);
    window.removeEventListener('storage', this._th);
    window.removeEventListener('sk-theme', this._th);
  }
  themeVals() {
    // Shared light / dark / system choice, remembered per viewer and synced across boards
    var stored = 'system';
    try { stored = localStorage.getItem('sk-theme') || 'system'; } catch (e) {}
    var theme = this.props.theme || stored;
    var self = this;
    var opts = [['light', 'Light'], ['dark', 'Dark'], ['system', 'System']].map(function (o) {
      var on = theme === o[0];
      return { id: o[0], label: o[1], pressed: on ? 'true' : 'false',
        isLight: o[0] === 'light', isDark: o[0] === 'dark', isSystem: o[0] === 'system',
        style: on ? 'background:#2A2E36;color:#FFFFFF' : 'background:transparent;color:#A9ADB6',
        set: function () {
          try { localStorage.setItem('sk-theme', o[0]); } catch (e) {}
          window.dispatchEvent(new Event('sk-theme'));
          self.forceUpdate();
        } };
    });
    return { theme: theme, themeOpts: opts };
  }
  renderVals() {
    var tv = this.themeVals(); return { theme: tv.theme, themeOpts: tv.themeOpts }; }
}
</script>
</body>
</html>
